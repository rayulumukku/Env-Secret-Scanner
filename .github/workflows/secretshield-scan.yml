name: SecretShield CI Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Weekly scan

jobs:
  secret-scan:
    name: SecretShield Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for diff scans

      - name: Run SecretShield Action
        uses: ./
        with:
          path: '.'
          fail-on: 'HIGH'
          diff-only: ${{ github.event_name == 'pull_request' }}
          sarif-file: 'secretshield-results.sarif'
          upload-sarif: 'true'
