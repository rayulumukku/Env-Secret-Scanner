name: "SecretShield — Secret Scanner"

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday at 4am UTC

permissions:
  contents: read
  security-events: write # Required for uploading SARIF to GitHub Code Scanning
  actions: read

jobs:
  scan:
    name: Secret Detection & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for history & PR diff scanning

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install --prefix packages/cli

      - name: Run SecretShield CI (SARIF output for Code Scanning)
        id: secretshield-sarif
        continue-on-error: true
        run: |
          node packages/cli/bin/secretshield.js ci --pr --sarif > secretshield-results.sarif

      - name: Upload SARIF report to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('secretshield-results.sarif') != ''
        with:
          sarif_file: secretshield-results.sarif
          category: secretshield-secrets

      - name: Run SecretShield CI (Enforce Severity Policy)
        run: |
          node packages/cli/bin/secretshield.js ci --pr --fail-on high
